name: Release Builds

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─── macOS Apple Silicon (arm64) ───────────────────────────────────────────
  build-macos-arm:
    name: macOS · Apple Silicon
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target aarch64-apple-darwin

      - name: Collect artifacts
        run: |
          mkdir -p release-out
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name "*.dmg" | head -1)
          TAR=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name "*.app.tar.gz" | head -1)
          [ -n "$DMG" ] && cp "$DMG" "release-out/ZCodeSnippets_0.1.0_aarch64.dmg"
          [ -n "$TAR" ] && cp "$TAR" "release-out/ZCodeSnippets_0.1.0_aarch64.app.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: release-out/

  # ─── macOS Intel (x86_64) ──────────────────────────────────────────────────
  build-macos-intel:
    name: macOS · Intel
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target x86_64-apple-darwin

      - name: Collect artifacts
        run: |
          mkdir -p release-out
          DMG=$(find src-tauri/target/x86_64-apple-darwin/release/bundle/dmg -name "*.dmg" | head -1)
          [ -n "$DMG" ] && cp "$DMG" "release-out/ZCodeSnippets_0.1.0_x64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-intel
          path: release-out/

  # ─── Linux (x86_64) ────────────────────────────────────────────────────────
  build-linux:
    name: Linux · x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect artifacts
        run: |
          mkdir -p release-out
          DEB=$(find src-tauri/target/release/bundle/deb -name "*.deb" | head -1)
          RPM=$(find src-tauri/target/release/bundle/rpm -name "*.rpm" | head -1)
          APP=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -1)
          [ -n "$DEB" ] && cp "$DEB" "release-out/ZCodeSnippets_0.1.0_amd64.deb"
          [ -n "$RPM" ] && cp "$RPM" "release-out/ZCodeSnippets_0.1.0_x86_64.rpm"
          [ -n "$APP" ] && cp "$APP" "release-out/ZCodeSnippets_0.1.0_amd64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: release-out/

  # ─── Windows x64 ───────────────────────────────────────────────────────────
  build-windows-x64:
    name: Windows · x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target x86_64-pc-windows-msvc

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-out | Out-Null
          $nsis = Get-ChildItem "src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis" -Filter "*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $msi  = Get-ChildItem "src-tauri\target\x86_64-pc-windows-msvc\release\bundle\msi"  -Filter "*.msi"        -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsis) { Copy-Item $nsis.FullName "release-out\ZCodeSnippets_0.1.0_x64-setup.exe" }
          if ($msi)  { Copy-Item $msi.FullName  "release-out\ZCodeSnippets_0.1.0_x64_en-US.msi" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release-out/

  # ─── Windows ARM64 ─────────────────────────────────────────────────────────
  build-windows-arm64:
    name: Windows · ARM64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target aarch64-pc-windows-msvc

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-out | Out-Null
          $nsis = Get-ChildItem "src-tauri\target\aarch64-pc-windows-msvc\release\bundle\nsis" -Filter "*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsis) { Copy-Item $nsis.FullName "release-out\ZCodeSnippets_0.1.0_arm64-setup.exe" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: release-out/
