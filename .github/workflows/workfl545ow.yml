name: Release Builds

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  # ─── macOS Apple Silicon (arm64) ───────────────────────────────────────────
  build-macos-arm:
    name: macOS · Apple Silicon
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        # reads version from package.json "packageManager" field automatically

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target aarch64-apple-darwin

      - name: Collect artifacts
        run: |
          mkdir -p release-out
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name "*.dmg" 2>/dev/null | head -1)
          TAR=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name "*.app.tar.gz" 2>/dev/null | head -1)
          [ -n "$DMG" ] && cp "$DMG" "release-out/ZCodeSnippets_0.1.0_aarch64.dmg" && echo "✓ DMG"
          [ -n "$TAR" ] && cp "$TAR" "release-out/ZCodeSnippets_0.1.0_aarch64.app.tar.gz" && echo "✓ TAR"
          ls -lh release-out/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: release-out/
          if-no-files-found: error

  # ─── macOS Intel (x86_64) ──────────────────────────────────────────────────
  build-macos-intel:
    name: macOS · Intel
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target x86_64-apple-darwin

      - name: Collect artifacts
        run: |
          mkdir -p release-out
          DMG=$(find src-tauri/target/x86_64-apple-darwin/release/bundle/dmg -name "*.dmg" 2>/dev/null | head -1)
          [ -n "$DMG" ] && cp "$DMG" "release-out/ZCodeSnippets_0.1.0_x64.dmg" && echo "✓ DMG"
          ls -lh release-out/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-intel
          path: release-out/
          if-no-files-found: error

  # ─── Linux (x86_64) ────────────────────────────────────────────────────────
  build-linux:
    name: Linux · x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect artifacts
        run: |
          mkdir -p release-out
          DEB=$(find src-tauri/target/release/bundle/deb -name "*.deb" 2>/dev/null | head -1)
          RPM=$(find src-tauri/target/release/bundle/rpm -name "*.rpm" 2>/dev/null | head -1)
          APP=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" 2>/dev/null | head -1)
          [ -n "$DEB" ] && cp "$DEB" "release-out/ZCodeSnippets_0.1.0_amd64.deb" && echo "✓ DEB"
          [ -n "$RPM" ] && cp "$RPM" "release-out/ZCodeSnippets_0.1.0_x86_64.rpm" && echo "✓ RPM"
          [ -n "$APP" ] && cp "$APP" "release-out/ZCodeSnippets_0.1.0_amd64.AppImage" && echo "✓ AppImage"
          ls -lh release-out/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: release-out/
          if-no-files-found: error

  # ─── Windows x64 ───────────────────────────────────────────────────────────
  build-windows-x64:
    name: Windows · x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target x86_64-pc-windows-msvc

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-out | Out-Null
          $nsis = Get-ChildItem "src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis" `
            -Filter "*-setup.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          $msi = Get-ChildItem "src-tauri\target\x86_64-pc-windows-msvc\release\bundle\msi" `
            -Filter "*.msi" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsis) { Copy-Item $nsis.FullName "release-out\ZCodeSnippets_0.1.0_x64-setup.exe"; Write-Host "✓ NSIS" }
          if ($msi)  { Copy-Item $msi.FullName  "release-out\ZCodeSnippets_0.1.0_x64_en-US.msi"; Write-Host "✓ MSI" }
          Get-ChildItem release-out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release-out/
          if-no-files-found: error

  # ─── Windows ARM64 (cross-compile from x64) ────────────────────────────────
  build-windows-arm64:
    name: Windows · ARM64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ARM64 MSVC toolchain — needed for cross-compilation
      - name: Install ARM64 MSVC toolchain
        uses: microsoft/setup-msbuild@v2

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target aarch64-pc-windows-msvc

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-out | Out-Null
          $nsis = Get-ChildItem "src-tauri\target\aarch64-pc-windows-msvc\release\bundle\nsis" `
            -Filter "*-setup.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsis) { Copy-Item $nsis.FullName "release-out\ZCodeSnippets_0.1.0_arm64-setup.exe"; Write-Host "✓ NSIS ARM64" }
          Get-ChildItem release-out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: release-out/
          if-no-files-found: error
